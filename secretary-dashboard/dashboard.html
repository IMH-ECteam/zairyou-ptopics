<title>今日の段取り盤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 上に「今・次・リスク」の帯、その下に根拠資料を1カラム（広い画面では2カラム）で積む操作盤 */
:root{

  --gray:#8a979f; --gray-soft:#e7ebee; --free:#2e7d4f;
  --font-body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --surface:#172026; --surface-2:#1e2930; --line:#2d3b44; --fg:#e4ebef; --muted:#9aabb5;
  --accent:#4fb3bf; --accent-ink:#0b1417; --accent-soft:#1b3a3f;
  --crit:#ff6f61; --crit-soft:#3d1f1c; --warn:#f0a840; --warn-soft:#3a2c14; --info:#7ea6f0; --info-soft:#1d2a44; --ok:#5fc48a; --ok-soft:#173326;
  --gray:#7d8c95; --gray-soft:#26323a; --free:#5fc48a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172026; --surface-2:#1e2930; --line:#2d3b44; --fg:#e4ebef; --muted:#9aabb5;
  --accent:#4fb3bf; --accent-ink:#0b1417; --accent-soft:#1b3a3f;
  --crit:#ff6f61; --crit-soft:#3d1f1c; --warn:#f0a840; --warn-soft:#3a2c14; --info:#7ea6f0; --info-soft:#1d2a44; --ok:#5fc48a; --ok-soft:#173326;
  --gray:#7d8c95; --gray-soft:#26323a; --free:#5fc48a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
a{color:var(--accent)} a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:19px;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:15px;margin:0;text-wrap:balance}
h3{font-size:13px;margin:0;color:var(--muted);font-weight:500}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}
header.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gray);flex:none}
.dot.ok{background:var(--ok)} .dot.err{background:var(--crit)} .dot.run{background:var(--info);animation:pulse 1s infinite} .dot.stale{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}} @media (prefers-reduced-motion:reduce){.dot.run{animation:none}}
button{font:inherit;font-size:13px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{border-color:var(--crit);color:var(--crit)}
button:disabled{opacity:.5;cursor:not-allowed}
button.sm{font-size:12px;padding:2px 8px}
.band{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){.band{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.kicker{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.big{font-size:18px;font-weight:700;line-height:1.4;margin:4px 0;overflow-wrap:anywhere}
.state-crit{border-color:var(--crit);box-shadow:inset 4px 0 0 var(--crit)}
.state-warn{box-shadow:inset 4px 0 0 var(--warn)}
.risk{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.risk li{list-style:none} .risk ul{margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;margin-right:6px;white-space:nowrap}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.gray{background:var(--gray-soft);color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
section.card{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.svgbox{overflow-x:auto;min-width:0}
svg text{font-family:var(--font-body)}
.note{background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--muted)}
.note.err{background:var(--crit-soft);color:var(--fg)}
.note.warn{background:var(--warn-soft);color:var(--fg)}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px}
td.r,th.r{text-align:right}
.tblwrap{overflow-x:auto}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:4px 10px;align-items:center}
@media (max-width:520px){.bar-row{grid-template-columns:1fr}}
.bar-name{font-size:12px;overflow-wrap:anywhere;line-height:1.35}
.bar-track{display:flex;align-items:center;gap:6px;min-width:0}
.bar-stack{display:flex;height:14px;border-radius:3px;overflow:hidden;flex:none;max-width:calc(100% - 8em)}
.bar-stack span{display:block;height:100%}
.bar-val{font-size:12px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.list{display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{min-width:0;flex:1 1 16em;overflow-wrap:anywhere}
.row .acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.confirm{flex-basis:100%;background:var(--warn-soft);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.confirm.crit{background:var(--crit-soft)}
details>summary{cursor:pointer;color:var(--muted);font-size:13px;padding:4px 0}
textarea{width:100%;min-height:9em;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);padding:8px}
input[type=date],input[type=text]{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);padding:3px 6px}
.hist{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end}
.hcol{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.hbar-area{height:90px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.hbar{width:70%;background:var(--crit);border-radius:3px 3px 0 0;min-height:1px}
.hgap{width:100%;height:90px;border:1px dashed var(--gray);border-radius:4px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 6px,var(--gray-soft) 6px 8px);line-height:1.3;padding:2px}
.hlab{font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.audit li{list-style:none;display:flex;gap:8px;align-items:baseline;padding:3px 0}
.audit ul{margin:0;padding:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;max-width:min(92vw,560px);z-index:20}
.toast.err{background:var(--crit);color:#fff}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.linkrow{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>今日の段取り盤</h1>
      <div class="muted small" id="today-line">読み込み中…</div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      <button class="primary" id="btn-refresh" type="button">今すぐ更新</button>
    </div>
  </header>
  <div class="chips" id="sync-chips" aria-label="ソースごとの同期状態"></div>
  <div id="page-note"></div>

  <div class="band" id="band">
    <div class="card" id="c-now"><div class="kicker">今</div><div class="big muted">読み込み中…</div></div>
    <div class="card" id="c-next"><div class="kicker">次</div><div class="big muted">読み込み中…</div></div>
    <div class="card" id="c-risk"><div class="kicker">リスク</div><div class="big muted">読み込み中…</div></div>
  </div>

  <div class="grid2">
    <section class="card" id="sec-schedule">
      <div class="sec-head"><h2>今日の予定（本人のカレンダーのみ）</h2><span class="small muted" id="sched-meta"></span></div>
      <div id="sched-allday"></div>
      <div class="svgbox" id="tl"></div>
      <div id="conflicts"></div>
    </section>
    <section class="card" id="sec-tasks">
      <div class="sec-head"><h2>タスク（Asana・自分の担当・未完了）</h2><span class="small muted" id="task-meta"></span></div>
      <div id="task-charts"></div>
      <div id="task-list"></div>
    </section>
  </div>

  <div class="grid2">
    <section class="card" id="sec-mail">
      <div class="sec-head"><h2>対応待ちメール</h2><span class="small muted" id="mail-meta"></span></div>
      <div id="mail-body"></div>
    </section>
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <section class="card" id="sec-ref">
        <div class="sec-head"><h2>参考：他の人の予定</h2><span class="small muted">本人の衝突・空き時間・件数には含めません</span></div>
        <div id="ref-body"></div>
      </section>
      <section class="card" id="sec-hist">
        <div class="sec-head"><h2>期限切れタスク数の推移（7日）</h2><span class="small muted">欠けた日は0で描かず「欠け・未同期」</span></div>
        <div id="hist-body"></div>
      </section>
    </div>
  </div>

  <div class="grid2">
    <section class="card" id="sec-auto">
      <div class="sec-head"><h2>自動更新</h2><span class="small muted">更新は読み取り専用。書き込みはボタン操作時のみ</span></div>
      <div id="auto-body"></div>
    </section>
    <section class="card" id="sec-audit">
      <div class="sec-head"><h2>自己監査（この表示の確定前チェック）</h2><span class="small muted" id="audit-meta"></span></div>
      <div id="audit-body" class="audit"></div>
    </section>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ---------- 基本ユーティリティ ---------- */
const TZ = "Asia/Tokyo";
const $ = (q) => document.querySelector(q);

}
function safeUrl(u) { return (typeof u === "string" && /^https:\/\//.test(u)) ? u : null; }

const todayStr = (now = new Date()) => jst(now).date;
function addDays(ds, n) { const d = new Date(ds + "T00:00:00+09:00"); d.setUTCDate(d.getUTCDate() + n); return jst(d).date; }
function dow(ds) { return new Date(ds + "T12:00:00+09:00").getUTCDay(); }
function toDate(iso) { if (!iso) return null; if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) return new Date(iso + "T00:00:00+09:00"); return new Date(/[zZ]$|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + "+09:00"); }

const pad = (n) => String(n).padStart(2, "0");

const mmdd = (ds) => ds ? `${+ds.slice(5, 7)}/${+ds.slice(8, 10)}` : "";

function pct(a, b) { return b ? (a / b * 100).toFixed(1) : "—"; }

/* ---------- 状態 ---------- */
const SRC = {
  calendar: { label: "予定（本人）", server: "Google Calendar" },
  asana: { label: "タスク", server: "Asana" },
  gmail: { label: "メール", server: "Gmail" },
  drive: { label: "資料", server: "Google Drive" },
  reference: { label: "参考の予定", server: "Google Calendar" },

const S = { db: null, mcp: null, sample: null, sources: {}, config: {}, automation: null, runstate: null, runs: [], drafts: {}, daily: {}, trigger: null, triggerErr: null, busy: new Set(), M: null, audit: [], pending: {}, draftEdits: {}, dbErr: null, boot: "loading" };
const staleMin = () => Number(S.config.staleMinutes) > 0 ? Number(S.config.staleMinutes) : 30;

/* ---------- コネクタ呼び出し ---------- */
function errText(e, server) {
  const c = e && e.code, sv = (e && e.server) || server || "";

    case "server_not_connected": return `${sv}が未接続です（claude.ai の設定 → コネクタで接続してください）`;
    case "needs_reauth": return `${sv}の認証が切れています（claude.ai の設定 → コネクタで再接続してください）`;
    case "not_in_manifest": return `${sv}はこのページで許可されていません（アーティファクトの権限から許可できます）`;
    case "approval_required": return `${sv}の利用許可が必要です（もう一度ボタンを押すと許可を求めます）`;
    case "selection_required": return `${sv}が複数あり、どれを使うか未選択です`;
    case "blocked_by_policy": return `${sv}のこの操作は組織のポリシーで止められています`;
    case "server_unavailable": return `${sv}が一時的に応答しません`;
    case "tool_error": return `${sv}がエラーを返しました：${String(e.message || "").slice(0, 200)}`;
    case "not_granted": case "capability_disabled": case "capability_removed": return "この表示環境ではコネクタを呼べません（claude.ai で開いてください）";

}
async function call(server, tool, input, write) {
  if (!S.mcp) throw { code: "not_granted", server, message: "mcp unavailable" };

    return r.payload;
  } catch (e) {

}

/* ---------- 取得（読み取りのみ） ---------- */
function parseWhen(v) { if (!v) return null; if (typeof v === "object") { if (v.dateTime) return { iso: v.dateTime, allDay: false }; if (v.date) return { iso: v.date, allDay: true }; return null; } if (typeof v === "string") return { iso: v, allDay: /^\d{4}-\d{2}-\d{2}$/.test(v) }; return null; }
function normEvent(e, origin) {
  const st = parseWhen(e.start ?? e.startTime), en = parseWhen(e.end ?? e.endTime);
  const atts = Array.isArray(e.attendees) ? e.attendees : [];
  const me = atts.find((a) => a && a.self);
  const video = e.hangoutLink || (e.conferenceData && Array.isArray(e.conferenceData.entryPoints) && (e.conferenceData.entryPoints.find((p) => p.entryPointType === "video") || {}).uri);
  return {
    id: String(e.id ?? e.eventId ?? ""), title: String(e.summary ?? e.title ?? ""),
    allDay: !!(st && st.allDay) || !!e.allDay, start: st ? st.iso : null, end: en ? en.iso : null,
    guests: atts.filter((a) => a && !a.self && !a.resource).length,
    organizerSelf: e.organizer ? !!e.organizer.self : true, selfResponse: me ? me.responseStatus || null : null,
    transparent: e.transparency === "transparent" || e.availability === "AVAILABILITY_FREE",
    link: safeUrl(e.htmlLink || e.viewUrl), meet: safeUrl(video),
    attachments: (Array.isArray(e.attachments) ? e.attachments : []).map((a) => ({ title: String(a.title || "添付資料"), url: safeUrl(a.fileUrl || a.url) })).filter((a) => a.url),
    status: e.status || null, origin,
  };
}
async function listEvents(calendarId, startDs, endDs) {
  const out = []; let pageToken;
  for (let i = 0; i < 5; i++) {
    const input = { startTime: `${startDs}T00:00:00`, endTime: `${endDs}T00:00:00`, orderBy: "startTime", pageSize: 250 };

async function fetchReference() {
  const t = todayStr(); const ids = Array.isArray(S.config.refCalendars) ? S.config.refCalendars.filter(Boolean) : [];

}
async function loadDb() {
  const db = S.db; const g = async (p) => { const sn = await db.doc(p).get(); return sn.exists ? sn.data() : null; };
  const [cfg, auto, rs] = await Promise.all([g("meta/config"), g("meta/automation"), g("meta/runstate")]);
  S.config = cfg || {}; S.automation = auto; S.runstate = rs;
  for (const k of Object.keys(SRC)) { const d = await g("sources/" + k); if (d) S.sources[k] = d; }
  const dr = await db.collection("drafts").get(); for (const d of dr.docs) S.drafts[d.id] = d.data();
  const dl = await db.collection("daily").get(); for (const d of dl.docs) S.daily[d.id] = d.data();
  try { const rn = await db.collection("runs").orderBy("at", "desc").limit(10).get(); S.runs = rn.docs.map((d) => d.data()); } catch (_) { S.runs = []; }
}
async function boot() {
  renderAll();
  const C = window.claude;
  if (!C || typeof C.use !== "function") { S.boot = "nodb"; renderAll(); return; }
  const [db, mcp, sample] = await Promise.all([C.use("db").catch(() => null), C.use("mcp").catch(() => null), C.use("sample").catch(() => null)]);
  S.db = db; S.mcp = mcp; S.sample = sample;
  if (db) {
    try { await Promise.race([loadDb(), sleep(10000).then(() => { throw { code: "timeout" }; })]); S.boot = "ok"; }
    catch (e) { S.boot = "ok"; S.dbErr = "読み込みに時間がかかっています（" + ((e && e.code) || "error") + "）"; }
  } else S.boot = "nodb";
  renderAll();
  if (mcp) {
    loadTrigger();
    const stale = Object.keys(SRC).filter((k) => { const x = S.sources[k]; return !x || !x.lastSuccess || ageMin(x.lastSuccess) >= staleMin() || jst(new Date(x.lastSuccess)).date !== todayStr(); });
    if (stale.length) refresh(stale, "起動時");
  }
}
$("#btn-refresh").addEventListener("click", () => refresh(Object.keys(SRC), "手動"));
let rT; window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { if (S.M) renderAll(); }, 200); });
setInterval(() => { const now = new Date(); const j = jst(now); $("#today-line").textContent = `${+j.date.slice(0, 4)}年${+j.date.slice(5, 7)}月${+j.date.slice(8, 10)}日（${WD[dow(j.date)]}） ${hm(now)} 時点・日本時間`; const M = compute(now); S.M = M; renderChips(); renderBand(M); }, 60000);
boot();
</script>
